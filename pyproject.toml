[project]
name = "ghst-bnet"
version = "0.1.0"
description = "An API client for the Battle.net web API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bnet"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
exclude = [
    "__init__.py",
    ".venv/*",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".vscode",
    ".ruff_cache",
    "build",
    "dist",
    "site-packages",
    "venv",
    "pyproject.toml",
]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "cr-lf"
